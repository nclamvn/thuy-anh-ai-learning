      "body": {
        "vi": "AI như máy in 3D trên màn hình là một ẩn dụ để giải thích việc biến mô tả thành sản phẩm. PoC hiện chỉ dựng thế giới cá voi mang thành phố, với năm lựa chọn: bầu trời, vườn, cầu sao, màu cá voi và tỷ lệ thành phố. Một con rồng, người bạn biết nói hoặc trò chơi có luật riêng chưa được tạo. Ta giữ mong muốn đó trong sổ, không đổi thành cá voi rồi gọi là đã làm xong.",

      "body": {
        "vi": "Thời lượng là đề xuất để thử, không phải chuẩn sư phạm. Nên diễn tập với người lớn và truyện giả lập trước. Trẻ có thể nói, vẽ, viết hoặc dừng ở bất kỳ bước nào. Không cần tên đầy đủ, ngày sinh, trường học, ảnh hoặc ghi âm để thử luồng này.",
        "en": "The timing is a pilot proposal, not a pedagogical standard. Rehearse with adults and synthetic stories first. A learner may speak, draw, write or stop at any step. Full names, birth dates, school details, images and recordings are unnecessary for this workflow."
      },
      "steps": [
        {
          "minutes": "0–3",
          "vi": "Mời và giải thích: đây là công cụ dựng một loại thế giới; người kể có thể nói không, đổi ý hoặc dùng giấy. Thống nhất việc tham gia với phụ huynh và hỏi riêng trẻ có muốn thử không theo quy trình của đơn vị tổ chức.",
          "en": "Invite and explain: this tool builds one kind of world; the storyteller may decline, change their mind or use paper. Agree participation with the guardian and separately ask whether the learner wants to try, under the organizer's process."

        {
          "minutes": "3–7",
          "vi": "Lắng nghe: hỏi con muốn kể điều gì; ghi đúng lời hoặc để trẻ kiểm lại bản người lớn ghi. Chưa đưa bảng lựa chọn máy vào thay ý tưởng.",
          "en": "Listen: ask what they want to tell; record their words or let them check the adult's transcription. Do not replace the idea with the machine's option list."
        },
        {
          "minutes": "7–12",
          "vi": "Làm rõ: hỏi tối đa ba câu gợi mở. Tách phần trẻ muốn giữ, gợi ý mới và phần máy chưa dựng được. Đọc lại trước khi chọn.",

        {
          "minutes": "12–17",

        {
          "minutes": "17–22",
          "vi": "Chơi và sửa: trẻ chọn một thay đổi có chủ đích; so trước–sau, xác nhận lại và dựng lại. Có thể chọn không sửa.",
          "en": "Play and revise: the learner chooses an intentional change; compare before and after, reconfirm and rerender. Choosing not to revise is valid."

        {
          "minutes": "22–25",
          "vi": "Kể lại: phần nào là ý của con? Máy đã giúp gì, chưa làm gì? Nếu kể cho một người khác, con sẽ nói thế nào? Lưu bản ghi chỉ khi đã thống nhất rõ mục đích và cách giữ dữ liệu.",
          "en": "Reflect: which part was your idea? What did the system help with and what did it not do? How would you explain it to someone else? Save notes only after agreeing their purpose and handling."
        }

      "title": {

      "body": {
        "vi": "Các nhóm tuổi dưới đây chỉ giúp người lớn chọn cách trò chuyện; chưa được thẩm định phát triển. Không suy đoán năng lực theo tuổi. Điều chỉnh theo cách giao tiếp thực tế của từng trẻ.",

          "en": "Invite naming and explaining choices: What happens in this world? Which part makes it feel like yours? What on the screen differs from what you imagined?"

      "body": {
        "vi": "Trong đợt diễn tập này, dùng người lớn và truyện giả lập; không mời trẻ hoặc dùng lời kể/định danh thật. Một người kể, một người thao tác, một người quan sát nếu có thể; nếu chỉ có hai người, ghi rõ ai kiêm vai trò. Các hành động bên dưới là việc cần thử, chưa phải kết quả. Quan sát hành động của người lớn cần được thực hiện trực tiếp; phần mềm không diễn thay hoặc tự xác nhận buổi thử.",
        "en": "Use adults and synthetic stories for this rehearsal; do not invite children or use real personal stories or identifying details. Assign a storyteller, an operator and an observer where possible; with two adults, record the combined roles. These are actions to try, not measured results. Adult actions must be observed directly; software does not role-play the people or automatically validate a rehearsal."
      },
      "steps": [

    {
      "id": "synthetic",
      "kind": "adult-rehearsal",
      "title": {
        "vi": "Tám tình huống giả lập để thử luồng",
        "en": "Eight synthetic workflow scenarios"
      },
      "body": {
        "vi": "Đây là dữ liệu mẫu do nhóm viết, không phải lời của trẻ hay kết quả thử. Người lớn chọn một tình huống rồi ghi điều thực sự xảy ra; không điền sẵn PASS. Các nhiệm vụ là tiêu chí quan sát, không bảo đảm máy sẽ hiểu mọi cách diễn đạt.",
        "en": "These are team-authored synthetic examples, not learner words or trial results. Adults select one and record what actually happens; do not prefill PASS. Tasks are observation criteria, not a promise that every phrasing is understood."
      },
      "items": [
        {
          "vi": "S01 · Cá voi và năm lựa chọn hỗ trợ. Lời mẫu: Con muốn cá voi màu xanh ngọc chở thành phố nhỏ. Ban đêm có vườn và cầu sao. Việc cần thử: Đối chiếu năm lựa chọn, lời gốc và cảnh; chỉ dựng sau xem lại/xác nhận.",
          "en": "S01 · Whale with supported choices. Synthetic words: I want a teal whale carrying a small city. At night there are gardens and a star bridge. Task: Compare all five choices, original words and scene; render only after review/confirmation."
        },
        {
          "vi": "S02 · Mong muốn ngoài mẫu. Lời mẫu: Con muốn con rồng chở một cửa hàng kẹo. Việc cần thử: Giữ rồng/cửa hàng kẹo là chưa dựng; không đổi âm thầm sang cá voi. Thử đường giấy, quay lại hoặc dừng.",
          "en": "S02 · Wish outside the template. Synthetic words: I want a dragon carrying a candy shop. Task: Keep dragon/candy shop visibly unrendered; no silent whale substitution. Try paper, return or stop."
        },
        {
          "vi": "S03 · Bầu trời mâu thuẫn. Lời mẫu: Con muốn cá voi chở thành phố. Trời vừa ban đêm vừa hoàng hôn. Việc cần thử: Mâu thuẫn phải được chọn lại rõ ràng; không xác nhận hộ hoặc coi đóng panel là đã giải quyết.",
          "en": "S03 · Conflicting sky. Synthetic words: I want a whale carrying a city. The sky is both night and sunset. Task: The conflict requires an explicit choice; do not resolve by confirming for someone or closing a panel."
        },
        {
          "vi": "S04 · Phủ định một lựa chọn. Lời mẫu: Con muốn cá voi chở thành phố, không có vườn và không có cầu sao. Việc cần thử: Kiểm cả lời phủ định và hai lựa chọn false; nếu máy chưa hiểu, sửa thủ công rồi xem lại.",
          "en": "S04 · Negating a supported choice. Synthetic words: I want a whale carrying a city, with no gardens and no star bridge. Task: Check the negation and both false choices; if unclear to the system, correct manually and review."
        },
        {
          "vi": "S05 · Bác bỏ gợi ý. Lời mẫu: Con muốn cá voi chở thành phố dưới trời đêm. Việc cần thử: Mở gợi ý rồi bác bỏ; ghi dữ liệu đã giữ và việc chưa áp dụng, không coi gợi ý là tác phẩm.",
          "en": "S05 · Reject a suggestion. Synthetic words: I want a whale carrying a city at night. Task: Preview then reject a proposal; record preserved data and non-adoption, without treating the proposal as artwork."
        },
        {
          "vi": "S06 · Đổi một chi tiết sau dựng. Lời mẫu: Giữ cầu sao, đổi bầu trời từ ban đêm sang hoàng hôn. Việc cần thử: Chỉ dùng sau một bản đã dựng có cầu sao. So trước/sau, giữ lựa chọn khác, xác nhận lại; ghi phiên bản nếu thực sự dựng.",
          "en": "S06 · Change one detail after print. Synthetic words: Keep the star bridge; change the sky from night to sunset. Task: Use after an actual printed world with a bridge. Compare before/after, preserve other choices and reconfirm; record a version only if rendered."
        },
        {
          "vi": "S07 · Chọn giấy. Lời mẫu: Hôm nay tôi muốn vẽ con rồng trên giấy. Việc cần thử: Chọn giấy là hành động hợp lệ; ghi chưa kiểm renderer, không chuyển mẫu để đủ buổi thử.",
          "en": "S07 · Choose paper. Synthetic words: Today I want to draw a dragon on paper. Task: Paper is valid; record renderer not tested rather than switching to the template to complete a trial."
        },
        {
          "vi": "S08 · Chọn dừng. Lời mẫu: Tôi chưa muốn dựng. Tôi muốn nghỉ. Việc cần thử: Dừng không chấm điểm; ghi lời/hành động nếu được phép, không tự cho là thất bại hoặc đã kiểm renderer.",
          "en": "S08 · Choose to stop. Synthetic words: I do not want to print yet. I want a break. Task: Stop without scoring; record words/actions if agreed, not automatic failure or renderer validation."
        }
      ],

        "sources": [],
        "outcomes": null
      }

    {
      "id": "evaluate",
      "kind": "metrics",
      "title": {
        "vi": "Đo quyền tác giả và khả năng sử dụng",
        "en": "Observe authorship and usability"
      },
      "body": {
        "vi": "Đề xuất diễn tập ba phiên với người lớn, rồi mời thử tối đa sáu gia đình ở một nhóm tuổi đã thống nhất, bắt đầu với 9–11 nếu phù hợp. Đây là mẫu nhỏ để phát hiện lỗi và sửa phương pháp; không đủ để kết luận hiệu quả giáo dục. Số lượng và ngưỡng dưới đây do nhóm đề xuất, chưa có kết quả.",
        "en": "Proposed sequence: three adult rehearsals, then up to six families in one agreed age band, starting with 9–11 if appropriate. This is a small sample for finding problems and improving facilitation, not establishing educational effectiveness. Counts and thresholds below are team proposals; there are no results yet."
      },
      "metrics": [
        {
          "id": "M1",
          "vi": "Nhận ra ý mình: trẻ tự chỉ hoặc kể ít nhất một chi tiết từ ý tưởng gốc. Ghi có/không/chưa quan sát cùng bằng chứng; không gán điểm năng lực.",
          "en": "Recognizes own idea: the learner identifies at least one original detail. Record yes/no/not observed with evidence; do not assign an ability score."
        },
        {
          "id": "M2",
          "vi": "Có quyền lựa chọn: ghi một lần trẻ giữ, sửa, bác bỏ gợi ý hoặc chọn dừng. Đếm hành động đã quan sát, không diễn giải im lặng thành đồng ý.",
          "en": "Has a choice: record an observed keep, change, rejection or decision to stop. Count observed acts; silence is not agreement."
        },
        {
          "id": "M3",
          "vi": "Hiểu giới hạn: sau khi xem, trẻ và người lớn phân biệt được một phần đã dựng với một phần chưa dựng. Không cần buộc trẻ trả lời như bài kiểm tra.",
          "en": "Understands a limit: after viewing, the learner and adult distinguish a rendered detail from an unrendered one. Avoid turning this into a compulsory quiz."
        },
        {
          "id": "M4",
          "vi": "Độ trung thành: người quan sát so lời gốc, bản được chọn và sản phẩm; ghi mỗi lần hệ thống hoặc người lớn thêm ý mà chưa hỏi. Mục tiêu thử: không có chi tiết gốc bị đổi âm thầm.",
          "en": "Fidelity: the observer compares the original words, selected blueprint and artifact, recording unasked additions by the system or adult. Pilot target: no silently replaced original detail."
        },
        {
          "id": "M5",
          "vi": "Công sức đồng hành: ghi số lần người lớn phải cứu luồng, lỗi máy, thời gian từng bước và mong muốn chưa đáp ứng. Chưa đặt mục tiêu tốc độ cho trẻ.",
          "en": "Facilitation effort: record rescues, technical failures, step durations and unmet wishes. Do not impose a speed target on learners."
        },
        {
          "id": "M6",
          "vi": "Muốn tiếp tục: hỏi trẻ có muốn thử lại, sửa, vẽ giấy hoặc nghỉ; giữ cả câu trả lời không muốn tiếp tục. Không dùng cảm xúc tức thời làm bằng chứng học tập.",
          "en": "Preference to continue: ask whether they would like to try again, revise, draw on paper or rest; retain negative answers. Momentary enthusiasm is not evidence of learning."
        }
      ],
      "items": [
        {
          "vi": "Điều kiện so sánh đề xuất: cùng ý tưởng được trẻ chọn, một phiên với giấy/bản thiết kế người lớn và một phiên với máy; đổi thứ tự giữa các gia đình nếu làm được. Ghi rõ tác động thứ tự và người điều phối; không tuyên bố thử nghiệm nhân quả.",
          "en": "Proposed comparison: learner-chosen ideas developed with paper/adult blueprinting and with the tool; vary order between families where feasible. Record order and facilitator effects; do not claim a causal experiment."
        },
        {
          "vi": "Cổng mở rộng đề xuất: ít nhất năm trong sáu phiên được ghi nhận trọn luồng hoặc lý do trẻ chọn dừng/giấy; mỗi phiên cần không quá hai lần người vận hành cứu lỗi thao tác hoặc kỹ thuật, không tính trò chuyện đồng hành. Mọi phiên ghi M1–M6 hoặc lý do chưa quan sát; không có lỗi đổi ý âm thầm chưa sửa. Báo riêng số phiên có dựng và sửa thật; không tính việc dừng là đã kiểm chứng renderer. Không đạt thì sửa và thử lại, không ép trẻ chọn mẫu cá voi để đủ số.",
          "en": "Proposed expansion gate: at least five of six sessions document the full workflow or the learner's choice to stop/use paper; no more than two operator rescues of interaction or technical failures per session, excluding facilitation conversations. Every session records M1–M6 or why unobserved; no unresolved silent replacement. Report actual render/revision sessions separately; stopping does not validate the renderer. If unmet, revise and repeat; never force the whale template to reach a target."
        }
      ],
      "provenance": {
        "type": "team-proposed-feasibility-hypotheses",
        "sources": [
          "MIT-DREAM",
          "UNICEF-3"
        ],
        "outcomes": null
      }

      "body": {
        "vi": "Dừng khi trẻ muốn dừng, khó chịu, mệt, không được quyền sửa hoặc bị thúc phải chọn cho kịp demo. Nếu xuất hiện nội dung cần chăm sóc thật, ưu tiên người lớn và quy trình của đơn vị tổ chức; không để AI làm người tư vấn thay thế. Nếu máy lỗi, trở lại lời kể, giấy hoặc cảnh trước đó.",
        "en": "Stop when the learner wants to stop, is distressed or tired, loses the ability to revise, or is rushed to satisfy a demo. If an issue needs real care, prioritize the adult and the organizer's process; do not substitute AI counseling. When the system fails, return to the story, paper or the previous artifact."
